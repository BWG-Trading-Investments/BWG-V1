<section id="leaders" class="leaders" [class.is-revealed]="revealed()">
  <div class="wrap">
    <!--
      Height is set in CSS and the width left to follow, so the lockup can never
      be stretched however the surrounding layout changes.
    -->
    <img
      class="ld__lockup reveal"
      style="--reveal-index: 0"
      [src]="lockup.src"
      [attr.alt]="lockup.alt"
      [width]="lockup.width"
      [height]="lockup.height"
      loading="lazy"
      decoding="async"
    />

    <header class="ld__head">
      <p class="eyebrow ld__eyebrow reveal" style="--reveal-index: 1">{{ copy.eyebrow }}</p>
      <h2 class="ld__heading reveal" style="--reveal-index: 2">{{ copy.heading }}</h2>
      <p class="ld__lead reveal" style="--reveal-index: 3">{{ copy.lead }}</p>
    </header>

    <ul class="roster" role="list">
      @for (leader of leaders; track leader.slug; let i = $index) {
        <li class="roster__item" [style.--card-index]="i">
          <!--
            The whole card is the link, so the target is the card rather than a
            small "read more" inside it, and it reaches the keyboard as one stop.
          -->
          <a class="card" [routerLink]="['/leaders', leader.slug]">
            <span class="card__media">
              <img
                class="card__photo"
                [src]="leader.photo"
                [attr.alt]="leader.name"
                [width]="leader.width"
                [height]="leader.height"
                loading="lazy"
                decoding="async"
              />
            </span>

            <span class="card__body">
              <span class="card__name">{{ leader.name }}</span>
              <span class="card__title">{{ leader.title }}</span>

              <span class="card__note">
                <bwg-icon class="card__icon" [name]="leader.cardIcon" [size]="18" />
                <span class="card__summary">{{ leader.cardSummary }}</span>
              </span>

              <span class="card__more" aria-hidden="true">
                View profile
                <svg
                  viewBox="0 0 20 20"
                  width="14"
                  height="14"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 10h11M11 6l4 4-4 4" />
                </svg>
              </span>
            </span>
          </a>
        </li>
      }
    </ul>
  </div>
</section>
