<section id="partnerships" class="section">
  <div class="section__inner">
    <p class="eyebrow">{{ copy.eyebrow }}</p>
    <h2 class="section__heading">{{ copy.heading }}</h2>

    <div class="partnerships__body">
      @for (paragraph of copy.body; track paragraph) {
        <p class="prose">{{ paragraph }}</p>
      }
    </div>

    <p class="eyebrow partnerships__label">{{ copy.partnerToLabel }}</p>
    <ul class="partnerships__list" role="list">
      @for (item of copy.partnerTo; track item) {
        <li>{{ item }}</li>
      }
    </ul>

    <p class="partnerships__closing">{{ copy.closing }}</p>
    <a class="partnerships__cta" href="#contact">{{ copy.cta }}</a>
  </div>
</section>
