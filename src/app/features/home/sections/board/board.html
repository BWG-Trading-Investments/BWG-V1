<section id="board" class="board" [class.is-revealed]="revealed()">
  <!--
    The environment. One set of layers spanning the whole section, drawn behind
    every director rather than behind each of them separately — which is what
    makes the row read as one room instead of three cards.

    Everything here is decoration and carries no meaning, so the whole stack is
    hidden from assistive technology.
  -->
  <div class="env" aria-hidden="true">
    <span class="env__daylight"></span>
    <span class="env__glass"></span>

    <span class="env__world">
      <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="0.6">
        <circle cx="100" cy="100" r="82" />
        <ellipse cx="100" cy="100" rx="31" ry="82" />
        <ellipse cx="100" cy="100" rx="59" ry="82" />
        <path d="M18 100h164" />
        <path d="M29 60h142" />
        <path d="M29 140h142" />
      </svg>
    </span>

    <span class="env__floor"></span>
  </div>

  <div class="wrap board__inner">
    <header class="board__head">
      <h2 class="board__title reveal" style="--reveal-index: 0">
        {{ copy.titleLead }} <span class="board__of">{{ copy.titleAccent }}</span>
        {{ copy.titleTail }}
      </h2>
      <p class="board__kicker reveal" style="--reveal-index: 1">{{ copy.kicker }}</p>
    </header>

    <ul class="cast" role="list">
      <!--
        The city beyond the glass. It lives here rather than with the other
        environment layers because it has to meet the floor the directors stand
        on, and that floor is measured from the figures — not from the section,
        whose height changes with the copy above and below it.
      -->
      <li class="cast__skyline" role="presentation" aria-hidden="true">
        <svg viewBox="0 0 1200 150" preserveAspectRatio="none">
          <g fill="currentColor">
            <rect x="20" y="66" width="64" height="84" />
            <rect x="96" y="30" width="46" height="120" />
            <rect x="156" y="88" width="80" height="62" />
            <rect x="250" y="48" width="54" height="102" />
            <rect x="318" y="98" width="70" height="52" />
            <rect x="402" y="18" width="58" height="132" />
            <rect x="474" y="74" width="48" height="76" />
            <rect x="536" y="106" width="92" height="44" />
            <rect x="642" y="40" width="52" height="110" />
            <rect x="708" y="84" width="74" height="66" />
            <rect x="796" y="10" width="46" height="140" />
            <rect x="856" y="94" width="66" height="56" />
            <rect x="936" y="58" width="56" height="92" />
            <rect x="1006" y="102" width="86" height="48" />
            <rect x="1106" y="70" width="74" height="80" />
          </g>
        </svg>
      </li>

      @for (director of directors; track director.name; let i = $index) {
        <li class="cast__member" [style.--member-index]="i">
          <figure class="cast__figure">
            <!--
              Height is fixed and width left to follow. Every file is the same
              height with the crown of the head at its top edge, so one shared
              height is all it takes to line the three of them up.
            -->
            <img
              class="cast__photo"
              [src]="director.photo"
              [attr.alt]="director.name + ', ' + director.role + ', BWG'"
              [width]="director.width"
              [height]="director.height"
              loading="lazy"
              decoding="async"
            />

            <figcaption class="plate">
              <span class="plate__panel">
                <span class="plate__name">{{ director.name }}</span>
                <span class="plate__role">{{ director.role }}</span>
              </span>
            </figcaption>
          </figure>
        </li>
      }
    </ul>

    <ul class="values" role="list">
      @for (value of values; track value.tail; let i = $index) {
        <li class="values__item" [style.--value-index]="i">
          <span class="values__icon" aria-hidden="true">
            <svg
              viewBox="0 0 20 20"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.15"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              @switch (value.icon) {
                @case ('compass') {
                  <circle cx="10" cy="10" r="7.2" />
                  <path d="m12.8 7.2-1.7 3.9-3.9 1.7 1.7-3.9z" />
                }
                @case ('horizon') {
                  <path d="M2.4 13.4h15.2" />
                  <path d="M5.6 13.4a4.4 4.4 0 0 1 8.8 0" />
                  <path d="M10 3.2v2M4.4 5.6l1.4 1.4M15.6 5.6l-1.4 1.4" />
                }
                @case ('leaf') {
                  <path d="M10 17V9.4" />
                  <path d="M10 9.4C10 6 12.6 3.4 16.4 3.2c.2 3.8-2.4 6.4-6.4 6.2z" />
                  <path d="M10 12.4C10 10.2 8.1 8.4 5.2 8.2c-.2 2.9 1.6 4.7 4.8 4.2z" />
                }
                @case ('diamond') {
                  <path d="M10 3.4 17 8l-7 8.6L3 8z" />
                  <path d="M3 8h14M10 3.4 7.4 8l2.6 8.6L12.6 8z" />
                }
                @case ('globe') {
                  <circle cx="10" cy="10" r="7.2" />
                  <path d="M10 2.8c1.9 2 2.9 4.5 2.9 7.2s-1 5.2-2.9 7.2c-1.9-2-2.9-4.5-2.9-7.2s1-5.2 2.9-7.2z" />
                  <path d="M3.1 7.8h13.8M3.1 12.2h13.8" />
                }
              }
            </svg>
          </span>
          <span class="values__label">
            <span class="values__lead">{{ value.lead }}</span>
            <span class="values__tail">{{ value.tail }}</span>
          </span>
        </li>
      }
    </ul>

    <p class="board__motto reveal" style="--reveal-index: 2">{{ copy.motto }}</p>
  </div>
</section>
